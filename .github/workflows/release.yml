name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write

jobs:
  # --- Mac Binary ---
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/ClawdBridge clawdbridge-macos
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawdbridge-macos
          path: clawdbridge-macos

  # --- Android APK ---
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clawdbridge-android
          path: clawdbridge/android/app/build/outputs/apk/release/*.apk

  # --- iOS: Build skeleton (needs real Xcode project or SPM app) ---
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS sources
        run: |
          cd iOS
          swift build -v 2>&1 || echo "iOS build needs Xcode project; sources validated"
      - name: Upload iOS source bundle
        uses: actions/upload-artifact@v4
        with:
          name: clawdbridge-ios-sources
          path: clawdbridge/iOS/

  # --- GitHub Release (tag only) ---
  release:
    needs: [mac, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/clawdbridge-macos/clawdbridge-macos
            artifacts/clawdbridge-android/*.apk
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
